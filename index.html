    <div class="fade-in container">
        <h1>Exercise 4.1: SVG Primitives & DOM Manipulation</h1>
        <p class="subtitle">Exploring scalable vector graphics coordinate systems, structural grouping, and shape rendering.</p>
        
        <div class="chart-container">
<svg width="600" height="400" style="border-radius: 8px; background: #ffffff; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 0 20px rgba(0,0,0,0.5);">                <!-- Environment -->
                <circle cx="500" cy="70" r="45" fill="#fef08a" style="filter: drop-shadow(0 0 15px rgba(254,240,138,0.4));" />
                
                <!-- Vegetation -->
                <rect x="80" y="200" width="20" height="100" fill="#78350f" />
                <circle cx="90" cy="170" r="50" fill="#10b981" style="filter: drop-shadow(0 0 10px rgba(16,185,129,0.3));" />

                <!-- Structure -->
                <rect x="200" y="160" width="200" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
                <polygon points="180,160 300,70 420,160" fill="#c084fc" stroke="#f8fafc" stroke-width="2" style="filter: drop-shadow(0 0 10px rgba(192,132,252,0.3));" />
                <rect x="270" y="220" width="60" height="80" fill="#475569" />
                
                <!-- Windows (Grouped & Translated) -->
                <g fill="#38bdf8" stroke="#0f172a" stroke-width="3" style="filter: drop-shadow(0 0 8px rgba(56,189,248,0.5));">
                    <rect x="220" y="180" width="40" height="40" />
                    <rect x="220" y="180" width="40" height="40" transform="translate(120, 0)" />
                </g>
            </svg>
        </div>
    </div>
