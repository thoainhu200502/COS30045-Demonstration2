<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonstration 2 - Interactive Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html"class="active">Ex 4.1: SVG Primitives</a>
        <a href="barchart.html">Ex 4.3-4.6: Data Binding</a>
        <a href="interactive.html">Ex 5 & 6: Interactive Dashboard</a>
    </nav>

    <div class="container fade-in">
        <h1>Ex 4.1: SVG Cottage</h1>
        
        <div class="svg-container" style="text-align: center; margin-top: 20px;">
            <svg viewBox="0 0 850 500" width="100%" height="100%" style="border-radius: 15px; background: #0f172a; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="6" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#1e1b4b" />
                        <stop offset="100%" stop-color="#3b0764" />
                    </linearGradient>
                </defs>

                <!-- Sky Background -->
                <rect width="100%" height="100%" fill="url(#sky)" />

                <!-- Moon -->
                <circle cx="700" cy="100" r="45" fill="#fef08a" filter="url(#glow)" />
                <circle cx="715" cy="90" r="40" fill="url(#sky)" /> 

                <!-- Stars Group -->
                <g fill="#ffffff" opacity="0.8">
                    <circle cx="100" cy="80" r="2" />
                    <circle cx="250" cy="50" r="1.5" />
                    <circle cx="400" cy="120" r="2.5" />
                    <circle cx="550" cy="60" r="1" />
                    <circle cx="800" cy="150" r="2" />
                    <circle cx="150" cy="180" r="1.5" />
                </g>

                <!-- Hills -->
                <ellipse cx="200" cy="550" rx="550" ry="200" fill="#064e3b" />
                <ellipse cx="750" cy="520" rx="450" ry="180" fill="#047857" />

                <!-- Left Tree -->
                <g transform="translate(100, 220)">
                    <rect x="40" y="100" width="25" height="120" fill="#451a03" />
                    <circle cx="50" cy="50" r="65" fill="#059669" />
                    <circle cx="0" cy="100" r="45" fill="#10b981" />
                    <circle cx="100" cy="100" r="45" fill="#34d399" />
                </g>

                <!-- Right Tree -->
                <g transform="translate(650, 280)">
                    <rect x="20" y="80" width="15" height="70" fill="#451a03" />
                    <circle cx="27" cy="40" r="45" fill="#059669" />
                    <circle cx="-5" cy="70" r="30" fill="#10b981" />
                    <circle cx="60" cy="70" r="30" fill="#34d399" />
                </g>

                <!-- Dirt Path -->
                <polygon points="400,430 450,430 580,500 280,500" fill="#b45309" opacity="0.9" />

                <!-- Main House Group -->
                <g transform="translate(300, 190)">
                    <!-- Chimney -->
                    <rect x="180" y="10" width="25" height="70" fill="#78350f" />
                    <polygon points="175,10 210,10 210,20 175,20" fill="#451a03" />
                    
                    <!-- Smoke -->
                    <g fill="#cbd5e1" opacity="0.5">
                        <circle cx="192" cy="-10" r="10" />
                        <circle cx="202" cy="-30" r="15" />
                        <circle cx="185" cy="-55" r="22" />
                    </g>

                    <!-- House Body -->
                    <rect x="30" y="80" width="190" height="160" fill="#4c1d95" rx="5" />
                    
                    <!-- Roof -->
                    <polygon points="5,80 125,-10 245,80" fill="#c084fc" stroke="#a855f7" stroke-width="5"/>
                    
                    <!-- Main Door -->
                    <rect x="105" y="150" width="40" height="90" fill="#f59e0b" rx="2" />
                    <circle cx="115" cy="195" r="4" fill="#ffffff" />
                    
                    <!-- Left Window -->
                    <g transform="translate(50, 120)">
                        <rect x="0" y="0" width="35" height="35" fill="#fef08a" filter="url(#glow)" rx="2"/>
                        <line x1="17.5" y1="0" x2="17.5" y2="35" stroke="#4c1d95" stroke-width="3" />
                        <line x1="0" y1="17.5" x2="35" y2="17.5" stroke="#4c1d95" stroke-width="3" />
                    </g>

                    <!-- Right Window -->
                    <g transform="translate(165, 120)">
                        <rect x="0" y="0" width="35" height="35" fill="#fef08a" filter="url(#glow)" rx="2"/>
                        <line x1="17.5" y1="0" x2="17.5" y2="35" stroke="#4c1d95" stroke-width="3" />
                        <line x1="0" y1="17.5" x2="35" y2="17.5" stroke="#4c1d95" stroke-width="3" />
                    </g>
                    
                    <!-- Attic Window -->
                    <circle cx="125" cy="45" r="16" fill="#fef08a" filter="url(#glow)" />
                    <line x1="125" y1="29" x2="125" y2="61" stroke="#4c1d95" stroke-width="2" />
                    <line x1="109" y1="45" x2="141" y2="45" stroke="#4c1d95" stroke-width="2" />
                </g>
            </svg>
        </div>
    </div>
</body>
</html>
